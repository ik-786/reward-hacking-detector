[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhdetect"
version = "0.1.0"
description = "Detect reward hacking in coding-agent solutions and trajectories"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Imran Khan" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["reward hacking", "llm evaluation", "coding agents", "benchmarks", "verification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rhdetect = "rhdetect.cli:main"

[tool.setuptools]
packages = ["rhdetect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
